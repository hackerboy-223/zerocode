name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ZeroCode and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pyinstaller

      - name: Build standalone executable
        run: >
          pyinstaller --clean --noconfirm --onefile
          --name zerocode
          --collect-all textual
          --collect-all rich
          --collect-all prompt_toolkit
          scripts/zerocode_entry.py

      - name: Smoke test executable (Windows)
        if: runner.os == 'Windows'
        run: .\dist\zerocode.exe --version

      - name: Smoke test executable (Unix)
        if: runner.os != 'Windows'
        run: ./dist/zerocode --version

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: zerocode-${{ matrix.os }}
          path: dist/zerocode*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: zerocode-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
