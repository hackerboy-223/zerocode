name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Desktop · \${{ matrix.label }}
    runs-on: \${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-22.04
            rust-target: ""
            bundles: "deb,rpm,appimage"
            target-args: ""
          - label: Windows x64
            os: windows-latest
            rust-target: ""
            bundles: "nsis,msi"
            target-args: ""
          - label: macOS Apple Silicon
            os: macos-latest
            rust-target: "aarch64-apple-darwin"
            bundles: "app,dmg"
            target-args: "--target aarch64-apple-darwin"
          - label: macOS Intel
            os: macos-latest
            rust-target: "x86_64-apple-darwin"
            bundles: "app,dmg"
            target-args: "--target x86_64-apple-darwin"

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev patchelf rpm libfuse2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: \${{ matrix.rust-target }}

      - name: Cache Rust build outputs
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: \${{ matrix.os }}-\${{ matrix.rust-target }}

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Build and publish Desktop bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./desktop
          tagName: \${{ github.ref_name }}
          releaseName: "ZeroCode \${{ github.ref_name }}"
          releaseBody: |
            ZeroCode \${{ github.ref_name }}

            Installeur interactif et paquets natifs pour Linux, Windows et macOS.
            Les empreintes SHA-256 des fichiers publiés sont disponibles dans SHA256SUMS.
          releaseDraft: false
          prerelease: \${{ contains(github.ref_name, '-') }}
          args: \${{ matrix.target-args }} --bundles \${{ matrix.bundles }}

  python:
    name: Python package and checksums
    runs-on: ubuntu-latest
    needs: desktop
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build source and wheel distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Add Python packages and SHA-256 manifest to the release
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: \${{ github.ref_name }}
        run: |
          mkdir -p release-assets
          gh release download "$TAG_NAME" --dir release-assets
          cp dist/* release-assets/
          cd release-assets
          sha256sum * > SHA256SUMS
          gh release upload "$TAG_NAME" * --clobber
