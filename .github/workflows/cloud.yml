name: ZeroCode Cloud CI

on:
  push:
    branches: [main, feature/cloud-platform-foundation]
    paths:
      - "cloud/**"
      - ".github/workflows/cloud.yml"
  pull_request:
    branches: [main]
    paths:
      - "cloud/**"
      - ".github/workflows/cloud.yml"

permissions:
  contents: read

jobs:
  cloud-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q app migrations tests
      - name: Test API
        run: pytest
      - name: Lint
        run: ruff check app tests migrations
