services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zerocode_cloud
      POSTGRES_USER: zerocode
      POSTGRES_PASSWORD: zerocode
    ports:
      - "5432:5432"
    volumes:
      - zerocode-cloud-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zerocode -d zerocode_cloud"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://zerocode:zerocode@db:5432/zerocode_cloud
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  zerocode-cloud-db:
