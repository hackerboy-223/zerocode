[package]
name = "zerocode-desktop"
version = "1.0.0"
description = "Agent de développement local ZeroCode Desktop"
authors = ["H@CKERBOY"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
